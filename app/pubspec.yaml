name: nesf_core
description: "NESF Core — HR & CRM for The NE Sports Foundation"
publish_to: 'none'
version: 1.0.0+2010

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking / state
  http: ^1.2.2
  # Supplies MediaType so multipart uploads declare a real MIME type.
  http_parser: ^4.1.0
  provider: ^6.1.2
  shared_preferences: ^2.3.3

  # Routing
  go_router: ^14.6.2

  # Attendance capture: front camera selfie + GPS fix
  image_picker: ^1.2.3
  geolocator: ^13.0.2

  # Tap-to-call and WhatsApp from a CRM contact
  url_launcher: ^6.3.1

  # Issued PDFs: save, open and share
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  share_plus: ^13.3.0

  # Formatting
  intl: ^0.20.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
